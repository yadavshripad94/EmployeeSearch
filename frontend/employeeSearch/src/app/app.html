
<div class="navbar">
  <div class="brand">Employee Search</div>
  <div class="company">FrontendtoAI</div>
</div>

<div class="main-container">
  <div class="employee-card">

    <div class="header-section">
      <h1>Employees</h1>
      <p>Search employees and view their details.</p>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <input
        type="text"
        placeholder="Search employee by name..."
        name="emp"
        [(ngModel)]="searchtxt"
      />

      <button type="button" (click)="searchEmployee()">Search</button>
    </div>

    <!-- Employee Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Emp ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>City</th>
          </tr>
        </thead>

        <tbody>
          @for (emp of employeeList(); track $index) 
          {
            <tr>
            <td>{{$index +1}}</td>
            <td>{{emp.name}}</td>
            <td>{{emp.email}}</td>
            <td>{{emp.city}}</td>
          </tr>
          }
          
        </tbody>
      </table>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Total Employees: <strong>6</strong></span>
      <span class="directory">Employee Directory</span>
    </div>

  </div>
</div>
